name: Fuel Terminal Agent Execution

# Define cuándo se corre el agente
on:
  workflow_dispatch: # Permite que tú le des al botón "Run workflow" manualmente
  schedule:
    - cron: '0 * * * *' # Opcional: Se corre solo cada hora (00, 01, 02...)

jobs:
  execute-crew:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código de tu repositorio al servidor de GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera las futuras ejecuciones

      # 3. Instala las librerías del requirements.txt que creamos
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecuta el agente
      - name: Run Fuel Terminal Crew
        env:
          # Aquí vinculamos el Secreto de GitHub con la variable que usa tu crew.py
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Si usas Azure para Outlook, agrega estas líneas:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python src/fuel_terminal_security_logistics_gatekeeper/main.py
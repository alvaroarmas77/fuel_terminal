phase_1___user_authentication:
  description: >
    ACCIÓN OBLIGATORIA DE SEGURIDAD: 
    1. Usa la herramienta 'access_control_tool' para buscar {dispatcher_email}. Verifica que existan datos en la columna 'Email', si el resultado es exitoso, guarda estos datos como el "Solicitante Autorizado".
    2. La herramienta leerá 'Master_Control.xlsx' en la pestaña 'Authorized_Users'.
    3. REGLA DE DETENCIÓN CRÍTICA: Si el resultado de la herramienta comienza con 'RECHAZO_FASE_1', 'ERROR_CONEXIÓN' o 'ERROR_SISTEMA', 
       DEBES ABORTAR el flujo de trabajo inmediatamente. No intentes ejecutar ninguna otra tarea y no reportes éxito.
    4. RESPUESTA DE ERROR: Si hay rechazo o error de sistema, retorna un mensaje final indicando: "PROCESO DETENIDO: El usuario {dispatcher_email} no tiene permisos de acceso o hubo un fallo técnico".
    5. Solo si el resultado de la herramienta es exitoso, se considera validado y puedes dar paso a la siguiente fase de validación de activos.
  expected_output: >
    Un reporte de estado de seguridad con este formato exacto:
    - ÉXITO: "PHASE_1_SUCCESS - Usuario: [Nombre] - Empresa: [Empresa]. Procediendo a validación de activos."
    - RECHAZO: "PROCESO DETENIDO: El correo {dispatcher_email} no se encuentra en la base de datos o error de sistema. Operación no autorizada."
  agent: security_authentication_specialist

phase_2___registry_validation:
  description: >
    REGLA DE DEPENDENCIA CRÍTICA: Revisa el output de 'phase_1___user_authentication'.
    ESTA TAREA SOLO DEBE EJECUTARSE si el resultado anterior fue 'PHASE_1_SUCCESS'. 
    Si la fase anterior falló o indica PROCESO DETENIDO, finaliza tu ejecución inmediatamente reportando el mismo error.
    
    INSTRUCCIONES DE VALIDACIÓN MULTI-REGISTRO:
     1. Usa `vehicle_registry_tool` para consultar la placa {truck_plate}. 
     2. CONSIDERACIÓN DE MULTIPLICIDAD: Identifica que para la placa {truck_plate} pueden existir múltiples conductores ({driver_name}), correos electrónicos y IDs internos vinculados en la pestaña 'Vehicle_registry'.
     3. RECOPILACIÓN DE DATOS: Extrae y valida la vigencia de todos los activos asociados. Debes mapear cada instancia encontrada de 'Truck_Plate', 'Driver_Name', 'Driver_Email' e 'ID_Interno'. **ES VITAL QUE CAPTURES EL Driver_Email EXACTO PARA USARLO EN LAS SIGUIENTES FASES.**
     4. CRITERIO DE FILTRADO: Si el {driver_name} proporcionado inicialmente no coincide con los registros, verifica si existe como conductor alternativo autorizado para esa misma placa antes de rechazar.
     5. REGLA DE DETENCIÓN: Si tras validar la lista completa el resultado es 'RECHAZO_FASE_2', DEBES ABORTAR la asignación de islas.
     6. ACCIÓN EN CASO DE FALLO: Si la validación falla para los activos solicitados, genera un mensaje detallando si el error es por la Placa, por el/los Conductores, o por falta de registros vigentes.
  expected_output: >
    Un dictamen de aptitud técnica estructurado que incluya:
    1. ESTADO: (PHASE_2_SUCCESS o RECHAZO).
    2. DETALLE DE ACTIVOS: Resumen de placa {truck_plate} y lista de conductores autorizados con sus respectivos Driver_Email.
    3. FORMATO ÉXITO: "PHASE_2_SUCCESS - Vehículo: {truck_plate}. Conductor: {driver_name} (Email: [Driver_Email]). Todos los registros están vigentes. Proceder a asignación de isla."
    4. FORMATO RECHAZO: "PROCESO DETENIDO: Error en validación de activos para la placa {truck_plate}."
  agent: registry_validation_specialist

phase_3___access_control:
  description: >
    VERIFICACIÓN DE SEGURIDAD OBLIGATORIA: 
    Antes de proceder, verifica que 'phase_1___user_authentication' haya devuelto 'PHASE_1_SUCCESS' 
    y que 'phase_2___registry_validation' haya devuelto 'PHASE_2_SUCCESS'. 
    REGLA DE GUARDA: Si alguna de las validaciones previas falló o indica un 'RECHAZO' o 'ERROR_CONEXIÓN', 
    NO uses herramientas, NO busques espacios en el calendario y finaliza con 'BLOQUEO'.

    INSTRUCCIONES DE PROGRAMACIÓN (Solo si los pasos anteriores son exitosos):
    1. Accede a los 7 calendarios de Outlook (Terminal_Isla_1 a Terminal_Isla_7).
    2. Busca disponibilidad para {requested_datetime} (30 min).
    3. REGLA DE NO TRASLAPE: El slot debe estar completamente libre.
    4. ACCIÓN DE RESERVA: Si encuentras espacio, reserva usando la placa {truck_plate}.
    5. GESTIÓN DE OCUPADO: Si no hay cupo, propón los 3 espacios de 30 minutos más cercanos.
  expected_output: >
    Un dictamen de programación:
    - ÉXITO: "PHASE_3_SUCCESS - Isla: [Número] - Horario confirmados."
    - ALTERNATIVA: "SLOT NO DISPONIBLE - Sugerencias: [Opciones]."
    - BLOQUEO: "OPERACIÓN CANCELADA - No se procedió por fallos en validación previa."
  agent: intelligent_scheduling_coordinator

phase_4___order_logging:
  description: >
    VERIFICACIÓN DE FLUJO Y GUARDA DE DATOS:
    1. REGLA DE DEPENDENCIA ABSOLUTA: Revisa los resultados de Fase 1, 2 y 3. 
       SOLO PROCEDE si el resultado de Fase 3 es 'PHASE_3_SUCCESS'. 
       Si recibiste 'OPERACIÓN CANCELADA' o 'BLOQUEO' en las fases previas, NO utilices 'order_management_tool' y finaliza tu tarea informando la cancelación.
    2. REGLA DE ORO: Los campos 'Start Time' y 'End Time' DEBEN ser 
       exactamente iguales a los confirmados por el Agente previo en la Fase 3.
    3. No inventes horarios. Si la Fase 3 confirmó '14:00', usa '14:00'.
    4. Usa 'order_management_tool' para registrar la orden {order_id}.
    5. GESTIÓN DE CARGA MÚLTIPLE: Identifica camiones ({truck_plate}), conductores ({driver_name}) y volúmenes ({fuel_volume}).
    6. REGLA DE REGISTRO: Usa 'order_management_tool' para crear o actualizar entradas en 'Master_Control_Orders.xlsx'. **ASEGÚRATE DE INCLUIR EL Driver_Email RECUPERADO EN LA FASE 2.**
    7. MAPEO DE COLUMNAS: OrderID ({order_id}), Date_of_Request ({current_date}), dispatcher_email ({dispatcher_email}), Driver_Email, truck_plate ({truck_plate}), Driver_Name, Fuel Volume (Gallons), Assigned Island, Appointment Date, Start Time y End Time.
    8. ATRIBUTO DE VINCULACIÓN: Mismo {order_id} for toda la orden maestra.
    9. Ejecuta iterativamente hasta registrar todos los activos confirmados en Fase 3.
  expected_output: >
    Reporte de consolidación:
    - ÉXITO: "PHASE_4_SUCCESS - ID Maestro: {order_id}. Registros completados en Excel."
    - ERROR: "FALLO DE REGISTRO: Error de conexión o validación previa no cumplida."
    - Confirmación del registro en el Master Control con los mismos horarios (Start/End) validados en la Fase 3.
  agent: order_logging_specialist

phase_5___multi_channel_communications:
  description: >
    REGLA DE CIERRE FINAL:
    1. Recupera el {dispatcher_email} validado en la Fase 1.
    2. Recupera la lista de correos de conductores de la Fase 2.
    3. Usa 'communications_tool' para notificar:
        - ÉXITO: **Solo si la Fase 4 indica 'PHASE_4_SUCCESS' para el ID {order_id}**, envía confirmación completa a despachador y conductores.
        - CANCELACIÓN: Si cualquier fase previa devolvió 'RECHAZO', 'BLOQUEO' o 'ERROR', informa ÚNICAMENTE al {dispatcher_email} sobre la denegación del servicio y el motivo.
    4. FORMATO CORREO DESPACHADOR: **Genera un cuerpo de correo en HTML profesional.** Incluye una tabla con bordes visibles que contenga: {order_id}, {truck_plate}, {driver_name}, {fuel_volume} y detalles de cita (Isla, Fecha, Hora Inicio/Fin).
    5. FORMATO CONDUCTOR: Mensaje corto con ubicación, hora y isla asignada. **Asegúrate de enviar un correo individual a cada Driver_Email obtenido en la Fase 2.**
    **CRÍTICO: Si el cuerpo del mensaje contiene variables vacías (TBD o None), sustitúyelas por "Información no disponible" antes de enviar.**
  expected_output: >
    Reporte final:
    - ÉXITO: "COMUNICACIONES ENVIADAS - Orden {order_id} notificada."
    - NOTIFICACIÓN_RECHAZO: "ALERTA ENVIADA - Despachador {dispatcher_email} notificado de la cancelación."
  agent: multi_channel_communications_manager
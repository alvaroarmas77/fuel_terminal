phase_1___user_authentication:
  description: >
    Leer el archivo 'Master_control.xlsx' en la pestaña 'Authorized_Users'. 
    Verificar si el correo del despachador {dispatcher_email} se encuentra en la columna 'Email'. 
    Si el correo no está registrado, el sistema debe detenerse y retornar un mensaje explicando 
    que no se puede continuar por no ser un usuario registrado. Si está presente, proceder a la Fase 2.
  expected_output: >
    Confirmación de "Acceso Concedido" con el nombre del usuario o mensaje de rechazo por usuario no registrado.

phase_2___registry_validation:
  description: >
    Leer el archivo 'Master_control.xlsx' en la pestaña 'Vehicle_registry'. 
    Validar la placa del vehículo {plate_id} y el nombre del conductor {driver_name} contra 
    los encabezados 'Truck Plate' y 'Driver Name'. Verificar también que el seguro y la 
    inspección técnica estén al día. Si algún dato no existe o no coincide, retornar un email 
    explicando que no se puede continuar por falta de registro de activos.
  expected_output: >
    Resumen técnico del vehículo y confirmación de aptitud para carga o mensaje de error de activos.

phase_3___access_control:
  description: >
    Buscar en los 7 calendarios de Outlook (Islands 1-7) el slot solicitado en {requested_datetime}. 
    Las citas deben ser en intervalos discretos de 30 minutos sin traslapes. 
    Si el espacio está libre, reservarlo y proceder a la Fase 4. Si está ocupado, proponer 
    los 3 siguientes espacios disponibles de 30 minutos en cualquiera de las islas. 
    Usar la placa {plate_id} como referencia para mantener el hilo de la conversación.
  expected_output: >
    Resultado de programación mostrando "Slot Confirmado" con isla y detalles, o "Slot No Disponible" con 3 alternativas.

phase_4___order_logging:
  description: >
    Tomar el ID de orden {order_id}, el volumen {fuel_volume} y los detalles de la cita 
    confirmados en la Fase 3 (Isla asignada, Fecha de cita, Hora de inicio y Hora de fin). 
    Usar la herramienta 'order_management_tool' para registrar físicamente estos datos 
    en el archivo 'Master_Control_Orders.xlsx'.
  expected_output: >
    Confirmación de que la fila con todos los campos técnicos (incluyendo tiempos y isla) 
    ha sido escrita en el registro de órdenes.

phase_5___multi_channel_communications:
  description: >
    Ejecutar el protocolo dual de comunicación usando el {order_id}: 
    1) Enviar correo profesional al despachador ({dispatcher_email}) con el resumen de la orden 
    en formato de tabla (ID, placa, conductor, volumen y cita). 
    2) Enviar correo optimizado para móviles a cada uno de los conductores ({driver_email}) con los detalles 
    esenciales de carga y ubicación de la terminal ({location}).
  expected_output: >
    Confirmación de envío de comunicaciones duales: correo profesional al despachador y notificación móvil al conductor.
name: Fuel Terminal Security Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  execute-gatekeeper:
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Esto acelera las ejecuciones futuras

      - name: Instalar Dependencias (Estrategia Holística)
        run: |
          python -m pip install --upgrade pip
          
          # 1. Instalamos las herramientas de Microsoft y procesamiento de datos
          pip install O365 msal pandas openpyxl
          
          # 2. Instalamos CrewAI y Google GenAI sin fijar versiones exactas
          # Esto permite que pip busque la mejor combinación que funcione para ambos.
          # Usamos >=0.28.0 para asegurar compatibilidad pero permitir parches.
          pip install "crewai>=0.28.8" "langchain-google-genai" "langchain-community"
          
          # 3. Limpieza de seguridad: Forzamos la actualización de langchain-core
          # para evitar el error de 'LangSmithParams' que vimos antes.
          pip install --upgrade langchain-core langsmith

      - name: Ejecutar Gatekeeper
        run: |
          # Añadimos la carpeta src al path de Python
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          # Ejecutamos el script
          python src/fuel_terminal_security_logistics_gatekeeper/main.py
name: Fuel Terminal Security Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  execute-gatekeeper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Gatekeeper
        env:
          # Inyectamos aquí, igual que en el proyecto que SI funciona
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Usamos la ruta absoluta de GitHub workspace para evitar errores de path
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          # Ejecución directa sin exports manuales
          python src/fuel_terminal_security_logistics_gatekeeper/main.py
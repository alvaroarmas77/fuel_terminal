name: Fuel Terminal Security Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  execute-gatekeeper:
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # El Secret ya no es vital, pero lo dejamos por si alguna otra herramienta lo pide
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      O365_TOKEN_JSON: ${{ secrets.O365_TOKEN_JSON }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install --no-cache-dir -r requirements.txt
          else
            pip install O365 msal pandas openpyxl crewai==0.28.0 langchain-google-genai
          fi
          pip install -e .

      # --- ESTE ES EL PASO CLAVE QUE FALTABA ---
      - name: Generar archivo de token O365
        run: |
          # Creamos el archivo físico a partir del Secret de GitHub
          echo '${{ secrets.O365_TOKEN_JSON }}' > o365_token.txt
          # Verificamos que se haya creado (opcional, para el log)
          ls -l o365_token.txt

      - name: Ejecutar Gatekeeper
        run: |
          python src/fuel_terminal_security_logistics_gatekeeper/main.py
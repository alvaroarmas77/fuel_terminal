name: Fuel Terminal Security Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  execute-gatekeeper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip show O365 || echo "O365 NOT INSTALLED"

      - name: Ejecutar Gatekeeper
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          # 1. BLINDAJE: Limpieza de la API KEY
          export GOOGLE_API_KEY=$(echo $GOOGLE_API_KEY | xargs)
          
          # 2. ACCIÓN DE LIMPIEZA: Eliminamos residuos de compilaciones anteriores
          echo "Limpiando caché de Python..."
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          
          # 3. EJECUCIÓN:
          # Si tu archivo está en la raíz, usa: python main.py
          # Si sigue dentro de src, usa la ruta completa:
          echo "Iniciando Gatekeeper System..."
          python src/fuel_terminal_security_logistics_gatekeeper/main.py
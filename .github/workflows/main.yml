name: Fuel Terminal Security Gatekeeper CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  execute-gatekeeper:
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # 1. Instalamos CrewAI y dejamos que él decida sus versiones base
          pip install crewai==0.28.0
          
          # 2. Instalamos las librerías de Azure y Google
          pip install O365 msal pandas openpyxl langchain-google-genai langchain-openai
          
          # 3. CORRECCIÓN CRÍTICA: Forzamos la versión de langchain-core que 
          # tiene tanto lo que necesita CrewAI como lo que necesita Google.
          pip install "langchain-core>=0.1.52,<0.3.0" --upgrade

      - name: Ejecutar Gatekeeper
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          python src/fuel_terminal_security_logistics_gatekeeper/main.py
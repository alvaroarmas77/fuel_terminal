name: Fuel Terminal Execution
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Eliminamos cache: 'pip' momentáneamente para forzar una instalación limpia
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Forzamos reinstalación limpia para evitar conflictos de Pydantic V1 vs V2
          pip install --no-cache-dir --force-reinstall pydantic crewai crewai-tools
          # Instalamos el resto de dependencias y el proyecto local
          pip install --prefer-binary -r requirements.txt
          pip install -e .

      - name: Run Diagnostic Test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python src/test_deploy.py

      - name: Run Gatekeeper Agent
        if: success()
        env:
          # Inyectamos el PATH para que Python encuentre el paquete 'src'
          PYTHONPATH: ${{ github.workspace }}/src
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        # Ejecutamos el script apuntando a la ruta completa
        run: python src/fuel_terminal_security_logistics_gatekeeper/main.py
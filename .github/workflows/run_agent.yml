name: Fuel Terminal Execution
on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Activa el caché nativo de GitHub para Python

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # --prefer-binary acelera la instalación de pandas y numpy
          pip install --prefer-binary -r requirements.txt
      - name: Run Diagnostic Test ##empieza la modificación aqui
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python src/test_deploy.py #hasta aqui

      - name: Run Gatekeeper Agent
        if: success() # Solo corre si el test de arriba pasó, acá termina la modificacion
        env:
          # Inyectamos el PATH para que Python encuentre el paquete 'src'
          PYTHONPATH: ${{ github.workspace }}/src
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        # Ejecutamos el script apuntando a la ruta completa
        run: python src/fuel_terminal_security_logistics_gatekeeper/main.py
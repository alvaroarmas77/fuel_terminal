name: Gatekeeper Fuel Terminal - Simulación y Auto

on:
  # Opción 1: Simulación Manual (Botón en GitHub)
  workflow_dispatch:
    inputs:
      sender:
        description: 'Correo del remitente (Simular Email)'
        required: true
        default: 'conductor_prueba@transporte.com'
      plate:
        description: 'Placa del vehículo a validar'
        required: true
        default: 'ABC-123'
      driver_name:
        description: 'Nombre del Conductor'
        required: true
        default: 'Juan Perez'
      volume:
        description: 'Volumen de combustible (galones)'
        required: true
        default: '5000'

  # Opción 2: Activación Automática
  repository_dispatch:
    types: [email_event]

jobs:
  validate-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "crewai[google-genai]" langchain-openai pandas openpyxl

      - name: Ejecutar Agente Gatekeeper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Si usas Gemini, asegúrate de tener GOOGLE_API_KEY en tus secretos
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            EMAIL="${{ github.event.inputs.sender }}"
            PLATE="${{ github.event.inputs.plate }}"
            NAME="${{ github.event.inputs.driver_name }}"
            VOL="${{ github.event.inputs.volume }}"
          else
            EMAIL="${{ github.event.client_payload.sender }}"
            PLATE="${{ github.event.client_payload.plate }}"
            NAME="Conductor Registrado"
            VOL="5000"
          fi
          
          # Se pasan todos los argumentos para evitar que el script pida inputs
          python src/fuel_terminal_security_logistics_gatekeeper/main.py \
            --email "$EMAIL" \
            --plate "$PLATE" \
            --name "$NAME" \
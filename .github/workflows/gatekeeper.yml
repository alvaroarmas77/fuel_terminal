name: Gatekeeper Fuel Terminal - Simulación y Auto

on:
  # Opción 1: Simulación Manual (Botón en GitHub)
  workflow_dispatch:
    inputs:
      sender:
        description: 'Correo del remitente (Simular Email)'
        required: true
        default: 'conductor_prueba@transporte.com'
      plate:
        description: 'Placa del vehículo a validar'
        required: true
        default: 'ABC-123'

  # Opción 2: Activación Automática (Para cuando logres conectar Power Automate/Make)
  repository_dispatch:
    types: [email_event]

jobs:
  validate-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install crewai langchain-openai pandas openpyxl

      - name: Ejecutar Agente Gatekeeper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Aquí puedes agregar más secrets si tu Excel está en la nube
        run: |
          # Lógica para detectar si es manual o automático
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            EMAIL="${{ github.event.inputs.sender }}"
            PLATE="${{ github.event.inputs.plate }}"
          else
            EMAIL="${{ github.event.client_payload.sender }}"
            PLATE="${{ github.event.client_payload.plate }}"
          fi
          
          # Ejecución del script principal con el modelo específico solicitado
          python main.py --email "$EMAIL" --plate "$PLATE" --model "gemini-3.1-pro-preview"
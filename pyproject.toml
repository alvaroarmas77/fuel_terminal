[project]
name = "fuel_terminal_security_logistics_gatekeeper"
version = "0.1.0"
description = "Security and Logistics Gatekeeper for Fuel Terminal using crewAI"
authors = [{ name = "Logistics Team", email = "admin@fuelterminal.com" }]
requires-python = ">=3.10,<3.12" # Estrechamos el rango para mayor estabilidad en el runner

dependencies = [
    "crewai>=0.30.0",               # Versión que corrige nativamente el error de BaseModel
    "crewai-tools>=0.2.0",          # Alineado con la nueva versión de crewai
    "pydantic>=2.6.1",              # Versión robusta de Pydantic V2
    "pandas>=2.1.0",
    "openpyxl>=3.1.2",
    "msal>=1.22.0",
    "O365>=2.0.3",
    "python-dotenv>=1.0.0",         # Esencial para cargar las API Keys en el runner
]

[project.scripts]
fuel_terminal_security_logistics_gatekeeper = "fuel_terminal_security_logistics_gatekeeper.main:run"
run_crew = "fuel_terminal_security_logistics_gatekeeper.main:run"
train = "fuel_terminal_security_logistics_gatekeeper.main:train"
replay = "fuel_terminal_security_logistics_gatekeeper.main:replay"
test = "fuel_terminal_security_logistics_gatekeeper.main:test"
run_with_trigger = "fuel_terminal_security_logistics_gatekeeper.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
[project]
name = "fuel_terminal_security_logistics_gatekeeper"
version = "0.1.0"
description = "Security and Logistics Gatekeeper for Fuel Terminal using crewAI"
authors = [{ name = "Alvaro Armas", email = "alvaroarmas@gmail.com" }]
requires-python = ">=3.10,<3.13"

dependencies = [
    "crewai[google,google-genai,tools]", # Driver nativo para Gemini 3.1
    "litellm==1.59.8",                  # VERSIÓN CRÍTICA: Evita desconexiones en la nube
    "google-generativeai>=0.8.0",       # Soporte para la API de Google
    "python-dotenv>=1.0.0",
    "pyyaml",
    "pandas>=2.1.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "O365",                             # Necesario para tus herramientas de Azure/Outlook
    "msal",                             # Permite autenticación sin token manual (.pickle)
    "pysqlite3-binary",                 # Fix necesario para bases de datos en GitHub Actions
]

[project.scripts]
gatekeeper_run = "fuel_terminal_security_logistics_gatekeeper.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_terminal_security_logistics_gatekeeper"]

[tool.crewai]
type = "crew"

[tool.uv]
package = true